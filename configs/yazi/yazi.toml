##########################
### Yazi Configuration ###
##########################

[mgr]
sort_by = "natural"
sort_sensitive = true
sort_dir_first = true
show_hidden = false
show_symlink = false

[preview]
wrap = "yes"

###############
### Plugins ###
###############

[plugin]
prepend_preloaders = [

  ##################
  # Media metadata #
  ##################
  { mime = "{audio,video,image}/*", run = "inspector" },
  { mime = "application/subrip", run = "inspector" },
  { mime = "application/postscript", run = "inspector" },

  #######################
  # Data files (DuckDB) #
  #######################
  { url = "*.csv", run = "duckdb", multi = false },
  { url = "*.tsv", run = "duckdb", multi = false },
  { url = "*.parquet", run = "duckdb", multi = false },
  { url = "*.xlsx", run = "duckdb", multi = false },
]

prepend_previewers = [

  ##################
  # Media metadata #
  ##################
  { mime = "{audio,video,image}/*", run = "inspector" },
  { mime = "application/subrip", run = "inspector" },
  { mime = "application/postscript", run = "inspector" },

  ###############################################################################
  # Data files (DuckDB) - listed before archives so .xlsx is not caught by ouch #
  ###############################################################################
  { url = "*.csv", run = "duckdb" },
  { url = "*.tsv", run = "duckdb" },
  { url = "*.parquet", run = "duckdb" },
  { url = "*.xlsx", run = "duckdb" },
  { url = "*.db", run = "duckdb" },
  { url = "*.duckdb", run = "duckdb" },

  #####################
  # Archive previewer #
  #####################
  { mime = "application/*zip", run = "ouch" },
  { mime = "application/x-tar", run = "ouch" },
  { mime = "application/x-bzip2", run = "ouch" },
  { mime = "application/x-7z-compressed", run = "ouch" },
  { mime = "application/x-rar", run = "ouch" },
  { mime = "application/vnd.rar", run = "ouch" },
  { mime = "application/x-xz", run = "ouch" },
  { mime = "application/xz", run = "ouch" },
  { mime = "application/x-zstd", run = "ouch" },
  { mime = "application/zstd", run = "ouch" },
  { mime = "application/java-archive", run = "ouch" },
]

######################################
# For opening files with application #
######################################

[opener]

###############################################
# Edit in Nvim (blocks Yazi until nvim exits) #
###############################################
text_opener = [{ run = 'nvim %s', block = true, desc = "Edit in Nvim" }]

###############################################
# Edit in Nvim inside a floating kitty window #
###############################################
text_opener_float = [
  { run = 'kitty --class yazi-nvim nvim %s', orphan = true, desc = "Edit in Nvim-float" },
]
##########################
# PDF opener for Zathura #
##########################
pdf_opener = [{ run = 'zathura %s', orphan = true, desc = "View PDF" }]

##########################
# Uses imv to open image #
##########################
image_opener = [{ run = 'imv %s', orphan = true, desc = "Open image" }]

##########################
# Uses mpv to open video #
##########################
video_opener = [
  { run = 'mpv --autofit-larger=70%x70% --force-window=yes %s', orphan = true, desc = "Open Video" },
]

###################
# Play using rmpc #
###################
music_opener = [
  { run = '$HOME/.local/bin/myScripts/yazi/play-music.sh %s', desc = "Play Music" },
]

#########################
# Add to the rmpc queue #
#########################
music_queue = [
  { run = '$HOME/.local/bin/myScripts/yazi/queue-music.sh %s', desc = "Add Queue" },
]

#######################
# Share via LocalSend #
#######################
localsend_opt = [
  { run = 'uwsm-app -- localsend %s', orphan = true, desc = "Share via LocalSend" },
]

#######################
# Extra image actions #
#######################
image_options = [
  { run = 'uwsm-app -- gimp %s', orphan = true, desc = "Edit in GIMP" },
  { run = 'uwsm-app -- $HOME/.local/bin/myScripts/wallpaperRelated/wallpaperSelect.sh --set %s', orphan = true, desc = "Set as Wallpaper" },
]

[open]
prepend_rules = [
  #############
  # Documents #
  #############
  { mime = "application/pdf", use = [
    "pdf_opener",
    "localsend_opt",
  ] },
  { url = "*.pdf", use = [
    "pdf_opener",
    "localsend_opt",
  ] },

  #########
  # Media #
  #########
  { url = "*.{mp3,flac,wav,m4a,ogg,opus}", use = [
    "music_opener",
    "music_queue",
    "localsend_opt",
  ] },
  { url = "*.gif", use = [
    "video_opener",
    "image_opener",
    "localsend_opt",
  ] },
  { mime = "image/*", use = [
    "image_opener",
    "image_options",
    "localsend_opt",
  ] },
  { mime = "video/*", use = [
    "video_opener",
    "localsend_opt",
  ] },
  { mime = "audio/*", use = [
    "music_opener",
    "music_queue",
    "localsend_opt",
  ] },

  ###############################
  # Text and Configs (Fallback) #
  ###############################
  { mime = "text/*", use = [
    "text_opener",
    "text_opener_float",
    "localsend_opt",
  ] },
  { mime = "application/json", use = [
    "text_opener",
    "text_opener_float",
    "localsend_opt",
  ] },
  { url = "*.{conf,toml,yaml,yml,json,ini,bak}", use = [
    "text_opener",
    "text_opener_float",
    "localsend_opt",
  ] },
  { url = "*.*rc", use = [
    "text_opener",
    "text_opener_float",
    "localsend_opt",
  ] },

  ############
  # Archives #
  ############
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*,x-iso9660-image,x-cd-image}", use = [
    "extract",
    "localsend_opt",
  ] },
  { url = "*.iso", use = [
    "extract",
    "localsend_opt",
  ] },

  ##############
  # Empty file #
  ##############
  { mime = "inode/empty", use = [
    "edit",
    "localsend_opt",
  ] },

  #######################
  # Virtual file system #
  #######################
  { mime = "vfs/{absent,stale}", use = "download" },

  #########
  # Trash #
  #########
  { mime = "trash/**", use = [
    "open",
    "trash",
  ] },

  ############
  # Fallback #
  ############
  { url = "*", use = [
    "open",
    "localsend_opt",
  ] },
]
