#####################
### yazi Keybinds ###
#####################

###########################
### Dropping into shell ###
###########################
[[mgr.prepend_keymap]]
on = "!"
for = "unix"
run = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

###################
### Smart-Paste ###
###################
[[mgr.prepend_keymap]]
on = "p"
run = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

#########################
### Add song to Queue ###
#########################
[[mgr.prepend_keymap]]
on = "A"
run = ['shell -- /home/Dazed/.local/bin/myScripts/yazi/queue-music.sh %s']
desc = "Add selected files to music queue"

#################
### Play Next ###
#################
[[mgr.prepend_keymap]]
on = "<A-n>"
run = ['shell -- /home/Dazed/.local/bin/myScripts/yazi/insert-music.sh %s']
desc = "Play Next"

#################
### Smart-Tab ###
#################
[[mgr.prepend_keymap]]
on = "t"
run = "plugin smart-tab"
desc = "create a tab and enter the hovered directory"

################################################################
### Copy selected file to the system clipboard while yanking ###
################################################################
[[mgr.prepend_keymap]]
on = "y"
run = [
  'shell -- for path in "$@"; do echo "file://$path"; done | wl-copy -t text/uri-list',
  "yank",
]
desc = "Yank and copy files to the system clipboard"

#########################################################
### Navigate parent directory without leaving the CWD ###
#########################################################
[[mgr.prepend_keymap]]
on = "K"
run = "plugin parent-arrow -1"
desc = "Move parent cursor up"

[[mgr.prepend_keymap]]
on = "J"
run = "plugin parent-arrow 1"
desc = "Move parent cursor down"

####################
### Smart-Switch ###
####################
[[mgr.prepend_keymap]]
on = "2"
run = "plugin smart-switch 1"
desc = "Switch or create tab 2"

##################################################
### Confirm quitting if multiple tabs are open ###
##################################################
[[mgr.prepend_keymap]]
on = "q"
run = "plugin confirm-quit"
desc = "Quit (confirm if multiple tabs are open)"

#####################
### Drag and drop ###
#####################
[[mgr.prepend_keymap]]
on = "<C-n>"
run = "shell 'dragon-drop -x -i -T \"$@\"' -- %s"
desc = "Drag and drop selected files"

#####################################
### Close input be once Esc press ###
#####################################
[[input.prepend_keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel input"

###########################
### Toggle Preview pane ###
###########################
[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

##########################################
### Alt + Space = Deselect and move up ###
##########################################
[[mgr.prepend_keymap]]
on = "<A-Space>"
run = ["toggle", "arrow -1"]
desc = "Deselect and move up"

############################################################
### Preview scrolling (Alt = preview, plain = file list) ###
############################################################
[[mgr.prepend_keymap]]
on = "<A-j>"
run = "seek 5"
desc = "Scroll preview down (DuckDB rows)"

[[mgr.prepend_keymap]]
on = "<A-k>"
run = "seek -5"
desc = "Scroll preview up (DuckDB rows)"

[[mgr.prepend_keymap]]
on = "<A-h>"
run = "plugin duckdb -1"
desc = "DuckDB: scroll one column left"

[[mgr.prepend_keymap]]
on = "<A-l>"
run = "plugin duckdb +1"
desc = "DuckDB: scroll one column right"

##########################################
### DuckDB: open in DuckDB / DuckDB UI ###
##########################################
[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "plugin duckdb -open"
desc = "Open file with DuckDB"

[[mgr.prepend_keymap]]
on = ["g", "u"]
run = "plugin duckdb -ui"
desc = "Open file with the DuckDB UI"
