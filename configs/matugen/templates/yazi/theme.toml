[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
find_keyword = { fg = "{{colors.tertiary.default.hex}}", italic = true }
find_position = { fg = "{{colors.primary.default.hex}}", bg = "reset", italic = true }
border_symbol = "│"
border_style = { fg = "{{colors.outline.default.hex}}" }

[status]
separator_open = ""
separator_close = ""
mode_normal = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
mode_select = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
progress_label = { fg = "{{colors.on_primary.default.hex}}", bold = true }
