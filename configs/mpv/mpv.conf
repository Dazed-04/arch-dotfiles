#mpv 0.37+
input-ipc-server=/tmp/mpvsocket

############################################################
# BASE = iGPU-friendly preset (this is what plain `mpv` uses)
# dGPU preset = [dgpu] section at the bottom: mpv --profile=dgpu
# NOTE: all global options must stay ABOVE the first [section]
############################################################

## Video
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=vaapi

# Cheap scaling for the iGPU
scale=spline36
cscale=spline36
dscale=mitchell
scale-antiring=0
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
interpolation=no
video-sync=audio

# HDR (cheap by default, [dgpu] overrides)
tone-mapping=bt.2390
hdr-compute-peak=no

# Dither
dither-depth=auto

# Deband (light; [simulcast] turns it on, [dgpu] makes it heavier)
deband=no
deband-iterations=1
deband-threshold=35
deband-range=16
deband-grain=0

#Always open the video player in full screen
fullscreen=yes

#Don't close the player after finishing the video
keep-open=yes

#The last position of your video is saved when quitting mpv
save-position-on-quit=yes

#Start mpv with a % smaller resolution of your screen
autofit=75%

#Force seeking (if seeking doesn't work)
force-seekable=yes

#Cursor hide in ms
cursor-autohide=100

#OSD (disabled, using an external one like uosc)
osc=no
osd-bar=no

#Subtitles
sub-ass-override=force
sub-font="Gandhi Sans"
sub-font-size=50
sub-color="#FFFFFF"
sub-border-size=2.4
sub-border-color="#FF000000"
sub-shadow-color="#A0000000"
sub-shadow-offset=0.75
sub-bold=yes
sub-ass-style-overrides=Kerning=yes
demuxer-mkv-subtitle-preroll=yes
embeddedfonts=yes
sub-ass-use-video-data=all

############################
# Protocol Specific Config #
############################
ytdl-raw-options=cookies-from-browser=%39%firefox:/home/Dazed/.zen/c16jj1pq.Dazed
ytdl-format="bestvideo[height<=1080]+bestaudio/best"


############################
# Conditional profiles     #
############################

[Downmix_Audio_5_1]
profile-cond=get("audio-params/channel-count") >= 5 and get("audio-params/channel-count") < 7
profile-restore=copy-equal
volume-max=200
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.707*FL+0.707*BL+0.5*LFE|FR=0.5*FC+0.707*FR+0.707*BR+0.5*LFE"

[Downmix_Audio_7_1]
profile-cond=get("audio-params/channel-count") >= 7
profile-restore=copy-equal
volume-max=200
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.3*FLC+0.3*FL+0.3*BL+0.3*SL+0.5*LFE|FR=0.5*FC+0.3*FRC+0.3*FR+0.3*BR+0.3*SR+0.5*LFE"

[crunchyroll]
profile-cond=filename:match("SubsPlease") or filename:match("Erai%-raws") or filename:match("HorribleSubs")
profile-restore=copy
sub-ass-use-video-data=all

[simulcast]
profile-cond=(function(a)for b,c in ipairs(a)do if filename:match(c)then return true end end end)({"SubsPlease","Erai%-raws","Tsundere%-Raws","%-VARYG","HorribleSubs","SubsPlus%+", "Yameii"})
profile-restore=copy
deband=yes

[youtube]
profile-cond=path ~= nil and path:match("https?://") ~= nil
profile-restore=copy
sid=no


############################
# Manual presets           #
############################

# dGPU / RTX 4060: full quality. Launch with: mpv --profile=dgpu (or mpv-dgpu)
[dgpu]
profile=high-quality
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=nvdec,nvdec-copy
scale-antiring=0.6
deband=no
deband-iterations=4
deband-grain=4
tone-mapping=bt.2446a
gamut-mapping-mode=auto
hdr-compute-peak=yes
