version = 4
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

[upgrade]
source = 'cdn'
interval = '168h'
auto = false
notice = false

[palette]
blue = 'blue'
cyan = 'cyan'
grey = '#6c6c6c'
yellow = 'yellow'
magenta = 'magenta'
red = 'red'
white = 'white'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
template = '{{.Icon}} '
foreground = 'p:white'
type = 'os'
style = 'plain'

[blocks.segments.options]
arch = "󰣇"

[[blocks.segments]]
template = '{{ .UserName }}@{{ .HostName }} '
foreground = 'p:red'
type = 'session'
style = 'plain'

[[blocks.segments]]
type = 'path'
style = 'plain'
foreground_templates = [
  "{{if gt .Code 0}}p:white{{end}}",
  "{{if eq .Code 0}}p:yellow{{end}}",
]
background = 'transparent'
foreground = 'p:cyan'
template = '{{ .Path }}'

[blocks.segments.options]
folder_icon = '....'
home_icon = '~'
max_depth = 3
style = 'agnoster_short'

[[blocks.segments]]
type = 'git'
style = 'plain'
foreground = 'p:grey'
background = 'transparent'
template = ' {{ .HEAD }}{{ if .Working.Changed }} <p:red>*{{add .Working.Modified .Working.Deleted .Working.Unmerged}}</>{{ end }}{{ if .Staging.Changed }} <p:magenta>+{{add .Staging.Modified .Staging.Deleted .Staging.Unmerged}}</>{{ end }}{{ if gt .Behind 0 }} <p:cyan></><p:white>{{ .Behind }}</>{{ end }}{{ if gt .Ahead 0 }} <p:cyan></><p:white>{{ .Ahead }}</>{{ end }}'

[blocks.segments.options]
branch_icon = ' '
cherry_pick_icon = ' '
commit_icon = ' '
fetch_status = true
fetch_upstream_icon = false
merge_icon = ' '
no_commits_icon = ' '
rebase_icon = ' '
revert_icon = ' '
tag_icon = ' '

[[blocks.segments]]
type = "python"
style = "plain"
foreground = 'blue'
background = 'transparent'
template = "  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} "

[[blocks.segments]]
type = 'executiontime'
style = 'plain'
background = 'transparent'
template = '<p:white>  </><p:red>{{ .FormattedMs }} </>'

[blocks.segments.properties]
threshold = 5000

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground_templates = [
  "{{if gt .Code 0}}p:red{{end}}",
  "{{if eq .Code 0}}p:white{{end}}",
]
background = 'transparent'
template = '❯'

[transient_prompt]
foreground_templates = [
  "{{if gt .Code 0}}p:red{{end}}",
  "{{if eq .Code 0}}p:white{{end}}",
]
background = 'transparent'
template = '❯ '

[secondary_prompt]
foreground = 'p:white'
background = 'transparent'
template = '❯❯ '
